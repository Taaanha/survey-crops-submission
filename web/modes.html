body{background-attachment:fixed}
.v-pop,.v-pop2,.v-glow{transform-box:fill-box}
.v-pop{animation:vpop .5s both;transform-origin:center}@keyframes vpop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.v-pop2{animation:vpop .7s both;transform-origin:center}
.v-fall{animation:vfall 1.1s linear infinite}@keyframes vfall{from{transform:translateY(0);opacity:0}20%{opacity:1}to{transform:translateY(60px);opacity:0}}
.v-drift{animation:vdrift 6s ease-in-out infinite alternate}@keyframes vdrift{to{transform:translateX(26px)}}
.v-glow{animation:vglow 2.4s ease-in-out infinite;transform-origin:center}@keyframes vglow{50%{opacity:.55;transform:scale(1.15)}}
.v-sway{animation:vsway 2.6s ease-in-out infinite alternate;transform-box:view-box}@keyframes vsway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.v-bob{animation:vbob 2s ease-in-out infinite}@keyframes vbob{50%{transform:translateY(-6px)}}
.v-drop{animation:vdrp 1.2s ease-in-out infinite alternate}@keyframes vdrp{from{transform:translateY(-10px)}to{transform:translateY(0)}}
.v-crawl{animation:vcr 3s ease-in-out infinite alternate}@keyframes vcr{to{transform:translateX(18px)}}
.v-leave{animation:vlv 3.5s ease-in forwards}@keyframes vlv{to{transform:translate(40px,-30px);opacity:0}}
.v-up{animation:vup 2s ease-in infinite}@keyframes vup{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
.v-slide{animation:vsl 4s ease-in-out forwards}@keyframes vsl{from{transform:translateX(-110px)}to{transform:translateX(var(--px,0px))}}
.v-water{animation:vwt 2s ease-in-out infinite alternate}@keyframes vwt{to{transform:translateY(-5px)}}
.v-drain{animation:vdn 4s ease-in forwards}@keyframes vdn{to{transform:translateY(24px);opacity:.2}}
.v-grow{animation:vgr 4s ease-out both;transform-origin:50% 100%;transform-box:view-box}@keyframes vgr{from{transform:scaleY(.3)}}
.v-fill{animation:vfl 3s ease-out forwards}@keyframes vfl{from{height:0}to{height:30px}}
.v-fill2{animation:vf2 3s ease-out both}@keyframes vf2{from{width:0}}
.v-pulse2{animation:vbob 1s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.vsvg *{animation:none!important}}
@media(max-width:899px){nav.bnav button.x{display:none}}
@media(min-width:900px){
 .shell{max-width:none!important;margin:0!important;padding:26px 40px 60px 264px!important}
 .page{max-width:1100px;margin:0 auto}
 .cols{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-areas:"ctl map" "inf map";align-items:start}
 .cols>.mapc{position:sticky;top:78px}
 #map{height:min(68vh,600px)!important}
 .vgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>

function apiBarDraw(){var b=$('#apibar');if(!b)return;if(!APIBAR.state){b.hidden=true;b.innerHTML='';return}
 b.hidden=false;b.innerHTML=(APIBAR.state==='waking'?'<span class="spin"></span>':'')+'<span>'+esc(s(APIBAR.state))+'</span>'+(APIBAR.state==='offline'?'<button class="pill" data-act="apiretry">'+esc(s('retry'))+'</button>':'')}
if(window.CS_API)CS_API.on(function(ev){
 if(ev.type==='start'&&ev.pending===1)APIBAR.failed=false;
 if(ev.type==='waking')APIBAR.state='waking';
 if(ev.type==='end'){if(ev.source!=='live')APIBAR.failed=true;if(ev.pending===0)APIBAR.state=APIBAR.failed?'offline':''}

function findKeys(o,re,out,p){out=out||[];p=p||'';if(o&&typeof o==='object'){Object.keys(o).forEach(function(k){var v=o[k];if(re.test(k)&&v!=null&&typeof v!=='object')out.push([p+k,v]);else if(re.test(k)&&v&&typeof v==='object'&&(v.en||v.bn))out.push([p+k,T(v)]);if(v&&typeof v==='object')findKeys(v,re,out,p+k+'.')})}return out}

function isoDate(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd}
function harvestISO(){if(st.harvestDate)return st.harvestDate;var o={w0:0,w1:7,w2:21,w3:35}[st.harvest];return isoDate(addD(NOW,o||0))}
function iso2d(i){return fd(new Date(i+'T00:00:00'))}
function planKey(){var f=floodDateOf();return JSON.stringify([st.district,st.lat,st.lon,harvestISO(),f?isoDate(f):null,st.water,st.prio])}
function ensurePlan(){if(PLAN.key===planKey()&&(PLAN.state==='wait'||PLAN.state==='done'))return;askPlan()}
function askPlan(){
 if(!window.CS_API||!window.CS_AD)return;var key=planKey();PLAN={state:'wait',key:key,res:null,ad:null,sent:null};paintPlan();
 var base='district='+st.district+'&lat='+st.lat+'&lon='+st.lon+'&lang='+lang,fdt=floodDateOf();
 var step=(st.flooded&&fdt)?fetchFlood():Promise.resolve(null);
 step.then(function(pf){
  var ready=null;if(pf){var e=pf.data&&pf.data.data&&pf.data.data.earliest_sowing_date;ready=e&&e.date}
  var q=base+'&prev_harvest='+harvestISO()+'&water='+WMAP[st.water]+(st.prio?'&priority='+st.prio:'')+(ready?'&flood_ready='+ready:'');
  var sent={harvest:harvestISO(),flood:fdt?isoDate(fdt):null};
  return CS_API.get('/api/v1/advisory?'+q).then(function(r){return {r:r,sent:sent}})}).then(function(x){
  if(PLAN.key!==key)return;                       // the farmer changed an answer meanwhile
  PLAN.res=x.r;PLAN.sent=x.sent;PLAN.ad=x.r.data?CS_AD.adapt(x.r.data):null;PLAN.state='done';paintPlan()})}
function paintPlan(){if(cur==='rotation')renderRotation();else if(cur==='plan')renderPlan();else if(cur==='pictures')renderPictures()}

 if(o.maturity)h+=esc(lang==='bn'?'পাকার তারিখ (মধ্যমান)':'Median maturity')+': '+iso2d(o.maturity.date)+' '+lsrc(o.maturity.src)+'<br>';

 if(o.eventsWorst)h+=esc(lang==='bn'?'সেচের সংখ্যা (সবচেয়ে খারাপ ২০%)':'Waterings (worst 20%)')+': '+mtxt(o.eventsWorst)+' '+lsrc(o.eventsWorst.src)+'<br>';

 h+='</p></div></div>';

 return '<div class="only-officer"><h2>'+esc(s('cmp'))+'</h2><div class="card cmp"><table><thead><tr>'+s('cmpH').map(function(x){return '<th>'+esc(x)+'</th>'}).join('')+'</tr></thead><tbody>'+rows+'</tbody></table><p style="color:var(--mute);font-size:.85em;margin-top:8px">* '+esc(s('notall'))+'</p></div></div>'}

 if(!ad.ok){h+='<div class="note warn"><span>'+esc(ad.errors.length?T(ad.errors[0]):s('planNone'))+'</span></div><button class="btn" data-act="go" data-v="farm">'+esc(lang==='bn'?'উত্তর বদলান':'Change my answers')+'</button>';$('#pg-rotation').innerHTML=h;return}

 if(live&&PLAN.sent)h+='<p style="color:var(--mute)">'+esc(s('planFor'))+': <b>'+iso2d(PLAN.sent.harvest)+'</b>'+(PLAN.sent.flood?' · '+esc(s('whenfl').replace('?',''))+': <b>'+iso2d(PLAN.sent.flood)+'</b>':'')+'</p>';

/* ---- flood: ask /post-flood, show what it returns (no maths here) ---- */
var FLOOD={key:null,state:'idle',res:null,ad:null,promise:null};
function bi(en,bn){return lang==='bn'?bn:en}
function floodKey(){var f=floodDateOf();return f?JSON.stringify([st.district,st.lat,st.lon,isoDate(f)]):null}
function fetchFlood(){
 var key=floodKey();if(!key||!window.CS_API||!window.CS_PF)return Promise.resolve(null);
 if(FLOOD.key===key&&FLOOD.promise)return FLOOD.promise;
 FLOOD={key:key,state:'wait',res:null,ad:null,promise:null};
 FLOOD.promise=CS_API.get('/api/v1/post-flood?district='+st.district+'&lat='+st.lat+'&lon='+st.lon+'&lang='+lang+'&flood_date='+isoDate(floodDateOf())).then(function(r){
  if(FLOOD.key===key){FLOOD.res=r;FLOOD.ad=r.data?CS_PF.adapt(r.data):null;FLOOD.state='done';repaintFlood()}return r});
 repaintFlood();return FLOOD.promise}
function repaintFlood(){if(cur==='issues')renderIssues();var b=$('#farmflood');if(b)b.innerHTML=floodMini()}
function floodLive(){return !!(FLOOD.res&&CS_API.isLive(FLOOD.res))}
function fsrc(ids){if(!FLOOD.ad||!ids||!ids.length)return '';return '<button class="src" data-act="fsrc" data-v="'+esc(ids.join(','))+'">'+bi('Source','উৎস')+' ›</button>'}
function fmeas(m){return m?N(m.value)+' '+esc(lang==='bn'?({'km²':'বর্গ কিমি','days':'দিন','scenes':'টি দৃশ্য','% of the observed area':'% (দেখা এলাকার)'}[m.unit]||m.unit):m.unit):''}
function spinner(){return '<span style="display:inline-block;width:14px;height:14px;border:2px solid var(--gold);border-top-color:transparent;border-radius:50%;vertical-align:-2px;margin-right:8px;animation:apispin 1s linear infinite"></span>'}
/* plots the server's rows as lines; marker dates also come from the server */
function lineChart(rows,keys,styles,markers,label){
 var W=320,H=110,P=6,vals=[];rows.forEach(function(r){keys.forEach(function(k){if(r[k]!=null)vals.push(r[k])})});
 if(rows.length<2||!vals.length)return '';
 var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(mx===mn)mx=mn+1;
 function X(i){return P+i*(W-2*P)/(rows.length-1)}function Y(v){return H-P-(v-mn)*(H-2*P)/(mx-mn)}
 var g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'" style="width:100%;height:auto;background:rgba(255,255,255,.04);border-radius:10px">';
 keys.forEach(function(k,ki){var pts=rows.map(function(r,i){return r[k]==null?null:X(i).toFixed(1)+','+Y(r[k]).toFixed(1)}).filter(Boolean).join(' ');g+='<polyline fill="none" stroke-width="2" style="'+styles[ki]+'" points="'+pts+'"/>'});
 (markers||[]).forEach(function(m){if(!m.date)return;var i=rows.findIndex(function(r){return r.date===m.date});if(i>=0)g+='<line x1="'+X(i).toFixed(1)+'" x2="'+X(i).toFixed(1)+'" y1="'+P+'" y2="'+(H-P)+'" stroke-dasharray="3 3" style="stroke:'+m.color+'"/>'});
 return g+'</svg><p style="color:var(--mute);font-size:.8em;margin:2px 0 8px">'+esc(label)+' · '+iso2d(rows[0].date)+' – '+iso2d(rows[rows.length-1].date)+'</p>'}
/* compact box on the Farm page */
function floodMini(){
 if(!floodKey())return '';
 if(FLOOD.state!=='done')return '<div class="card" style="margin-bottom:0"><p>'+spinner()+esc(s('planWait'))+'</p></div>';
 var a=FLOOD.ad;
 if(!a)return '<div class="note warn"><span>'+esc(s('offline'))+'</span></div>';
 if(!a.ok||!a.earliest)return '<div class="note warn"><span>'+esc(a.errors.length?T(a.errors[0]):s('noflood'))+'</span></div>';
 var d=new Date(a.earliest.date+'T00:00:00');
 return '<div class="card gold" style="margin-bottom:0"><div class="note'+(floodLive()?'':' warn')+'" style="margin:0 0 8px"><span class="badge">'+esc(floodLive()?s('planLive'):s('planDemo'))+'</span></div><div class="big-date"><div class="cal"><b>'+N(d.getDate())+'</b><span>'+MON[lang][d.getMonth()].toUpperCase()+' '+N(d.getFullYear())+'</span></div><div><h3>'+esc(s('earliestAny'))+' '+fsrc(a.earliest.src)+'</h3>'+(a.earliest.basis?'<p style="color:var(--mute)">'+esc(T(a.earliest.basis))+'</p>':'')+'</div></div>'+(a.soil&&a.soil.days?'<p style="margin-top:8px">'+esc(s('soilN'))+' <b>'+N(a.soil.days.value)+'</b> '+esc(s('days'))+'</p>':'')+'<button class="btn sm" data-act="go" data-v="issues" style="margin-top:8px">'+esc(bi('Flood details','বন্যার বিস্তারিত'))+'</button></div>'}

 ensurePlan();var k=chosenKey(),co=chosenOpt(),swTxt=(co&&co.sow)?iso2d(co.sow.date):'';

 var RT={farm:renderFarm,issues:renderIssues,rotation:renderRotation,twin:renderTwin,plan:renderPlan,learn:renderLearn,pictures:renderPictures,sources:renderSources,server:renderServer,data:window.renderData,model:window.renderModel,evidence:window.renderEvidence,strategies:window.renderStrategies,future:window.renderFuture};if(RT[p])RT[p]();

document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,v=b.dataset.v;
 if(a==='go')go(v);
 else if(a==='back')history.length>1?history.back():go('field');

 else if(a==='apiretry'){APIBAR.failed=false;APIBAR.state='waking';apiBarDraw();liveLoad(true)}

  navigator.geolocation.getCurrentPosition(function(p){st.lat=p.coords.latitude;st.lon=p.coords.longitude;st.fromField=false;st.areaM2=2000;if(MAP)MAP.setView([st.lat,st.lon],17);outline();$('#finfo').innerHTML=fieldInfo();toast(lang==='bn'?'অবস্থান পাওয়া গেছে। জেলা বাছুন (ডেমোতে সার্ভার জেলা মেলায় না)।':'Location found. Pick the district (the live server matches it; the demo cannot).')},function(){toast(lang==='bn'?'অবস্থান পাওয়া যায়নি':'Could not get your location')},{timeout:10000})}
 else if(a==='crop'){st.current=v;renderFarm()}
 else if(a==='flood'){st.flooded=!st.flooded;if(!st.flooded)st.floodMode=null;renderFarm()}

 else if(a==='getplan'){PLAN.key=null;go('rotation')}
 else if(a==='replan'){PLAN.key=null;renderRotation()}
 else if(a==='replan2'){PLAN.key=null;renderPlan()}

 else if(a==='wat'){st.water=v;renderFarm()}
 else if(a==='prio'){st.prio=st.prio===v?null:v;renderFarm()}
 else if(a==='choose'){st.chosen=v;renderRotation();toast(s('chosen'))}
 else if(a==='sms'){var t=smsText();if(!t){toast(s('offline'));return}(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast(s('copied'))},function(){toast(t)})}

 else if(a==='mode'){st.mode=st.mode==='farmer'?'officer':'farmer';full()}
 else if(a==='setmode'){st.mode=v;full()}
 else if(a==='scenePlay')scenePlay();
 else if(a==='say'){var tt=s('stepsT')[v]+'. '+s('stepsD')[v];speakText(tt,'step-'+v)}
 else if(a==='raw'){var dd=$('#dlg');var oo=chosenOpt();var rawO=oo&&PLAN.res&&PLAN.res.data&&PLAN.res.data.data?(PLAN.res.data.data.options||[]).filter(function(x){return x.crop===oo.id})[0]:null;dd.innerHTML='<h3>JSON</h3><pre class="json">'+esc(JSON.stringify({source:PLAN.res&&PLAN.res.source,option:rawO||null},null,1))+'</pre><button class="btn sm" data-act="close">OK</button>';dd.showModal?dd.showModal():dd.setAttribute('open','')}
 else if(a==='vid')vidOpen(v);else if(a==='vclose')vidClose();else if(a==='vplay'){vid.play=!vid.play;if(vid.play&&vid.i>=VIDS[vid.id].length-1)vid.i=0;vidDraw();vidTick()}else if(a==='vnext'){if(vid.i<VIDS[vid.id].length-1){vid.i++;vidDraw()}}else if(a==='vprev'){if(vid.i>0){vid.i--;vidDraw()}}else if(a==='vhear'){vid.hear=!vid.hear;vidDraw()}
 else if(a==='close'){var d2=$('#dlg');d2.close?d2.close():d2.removeAttribute('open')}

});
